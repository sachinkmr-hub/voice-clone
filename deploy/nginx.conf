# Serves the dashboard and reverse-proxies the API, so the browser sees one origin and
# there is no CORS surface at all in production.

server {
    listen 80;
    server_name _;

    # A 25 MB upload cap that matches MAX_UPLOAD_BYTES in routes_analyze.py — rejecting
    # at the proxy avoids streaming a rejected body all the way to the app.
    client_max_body_size 25M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /v1/stream and /v1/dashboard.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A call can be long and mostly quiet; do not time out a live stream.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /console { proxy_pass http://backend:8000/console; }
    location /static/ { proxy_pass http://backend:8000/static/; }
    location /docs    { proxy_pass http://backend:8000/docs; }
    location /openapi.json { proxy_pass http://backend:8000/openapi.json; }
}
