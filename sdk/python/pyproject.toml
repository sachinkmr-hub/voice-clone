[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceguard-sdk"
version = "1.0.0"
description = "Python client for the VoiceGuard real-time voice-clone detection API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.26"]

[project.optional-dependencies]
stream = ["websockets>=12.0"]

[tool.setuptools.packages.find]
include = ["voiceguard_sdk*"]
