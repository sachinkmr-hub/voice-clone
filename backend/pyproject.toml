[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceguard"
version = "1.0.0"
description = "Real-time AI voice-clone and impersonation detection (SIH26104)"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "python-multipart>=0.0.9",
  "PyJWT>=2.8",
  "joblib>=1.3",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.26"]
torch = ["torch>=2.2", "torchaudio>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["voiceguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
